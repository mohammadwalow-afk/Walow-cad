<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0e17">
<link rel="manifest" href="manifest.json">
<title>WALOW CAD - البستن أكل وشرب</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#0a0e17;color:#fff;padding-bottom:20px}
header{padding:14px;background:#111827;border-bottom:1px solid #222;display:flex;justify-content:space-between}
.card{background:#111827;border:1px solid #222;border-radius:14px;padding:12px;margin:10px}
button{background:#1f2937;color:#fff;border:1px solid #374151;padding:10px 12px;border-radius:9px;font-weight:700;cursor:pointer}
.btn-pro{background:#2563eb;border:none}.btn-ok{background:#059669;border:none}.btn-food{background:#f59e0b;border:none;color:#000}
#view{width:100%;height:480px;border-radius:12px;overflow:hidden;background:#0f172a;position:relative;border:1px solid #334155}
#hud{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.85);padding:10px;border-radius:10px;font-size:12px;pointer-events:none}
.row{display:flex;gap:8px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:8px;border-bottom:1px solid #222;text-align:right}th{color:#38bdf8}
input{flex:1;background:#030712;border:1px solid #374151;color:#fff;padding:11px;border-radius:9px}
</style>
</head>
<body>
<header><div><b>WALOW <span style="color:#38bdf8">CAD V7 - البستن شبعان</span></b><div style="font-size:11px;color:#999">بدون جن • بدون عفاريت • بس هندسة صح</div></div><span>🍔💪</span></header>

<div class="card">
<b>✨ اطلب أي آلة:</b>
<div class="row" style="margin-top:8px"><input id="prompt" placeholder="محرك ، سفينة ، تعليق ، تروس..."><button class="btn-pro" onclick="buildFromPrompt()">⚡ بناء</button></div>
<div id="detected" style="font-size:12px;color:#fbbf24;margin-top:6px">البستن أكل وشرب، جاهز يشتغل 💪</div>
</div>

<div class="card"><div class="row">
<button class="btn-pro" onclick="loadEngine()">🔥 محرك 4 بستن - شبعان</button>
<button onclick="loadShip()">🚢 سفينة</button>
<button onclick="loadSusp()">تعليق</button>
<button onclick="loadGear()">⚙️ تروس</button>
</div></div>

<div class="card">
<div id="view"><div id="hud"><b>📐 الأبعاد mm</b><div>280 × 180 × 160</div><div id="sel">اضغط أي قطعة</div><div id="cnt" style="color:#10b981"></div><div id="pistonHealth" style="color:#f59e0b">🍔 صحة البستن: 100% - شبعان</div></div></div>
<div class="row" style="margin-top:10px">
<button class="btn-pro" onclick="playing=!playing">⏯ تشغيل / إيقاف</button>
<button class="btn-ok" onclick="explode()">💥 تفكيك / تجميع</button>
<button class="btn-food" onclick="feedPiston()">🍔 أكّل البستن</button>
<button onclick="resetCam()">🎯 توسط - رجّع المحرك عدل</button>
</div>
<div style="margin-top:8px">زاوية الكرنك: <b id="ang">0°</b> | ضغط: <b id="prs">1.0 bar</b> | سرعة: <b id="rpmTxt">90 RPM</b></div>
<div><label>سرعة المحرك</label><input type="range" id="rpm" min="0" max="300" value="90" oninput="document.getElementById('rpmTxt').textContent=this.value+' RPM'" style="width:100%"></div>
<canvas id="graph" width="340" height="70" style="width:100%;background:#020617;border-radius:8px;margin-top:8px"></canvas>
</div>

<div class="card"><b>🔩 BOM</b><table><thead><tr><th>#</th><th>القطعة</th><th>الأبعاد</th><th>الخامة</th></tr></thead><tbody id="bom"></tbody></table></div>

<script>
let scene,camera,renderer,group,parts=[],selected=null,playing=true,angle=0,assembled=true,health=100;
let raycaster=new THREE.Raycaster(),mouse=new THREE.Vector2();
let gctx=document.getElementById('graph').getContext('2d'),hist=[];

// دالة الخلق - الصحيحة 100%
function mk(w,h,d,color,x,y,z,shape='box',op=1){
  let geo;
  if(shape=='cylY') geo=new THREE.CylinderGeometry(w/2,w/2,h,24);
  else if(shape=='cylX') geo=new THREE.CylinderGeometry(w/2,w/2,h,24);
  else if(shape=='cylZ') geo=new THREE.CylinderGeometry(w/2,w/2,h,24);
  else if(shape=='sphere') geo=new THREE.SphereGeometry(w/2,20,20);
  else if(shape=='cone') geo=new THREE.ConeGeometry(w/2,h,24);
  else geo=new THREE.BoxGeometry(w,h,d);
  let mat=new THREE.MeshStandardMaterial({color:color,roughness:.3,metalness:.6,transparent:op<1,opacity:op});
  let m=new THREE.Mesh(geo,mat); m.position.set(x,y,z);
  if(shape=='cylX') m.rotation.z=Math.PI/2;
  if(shape=='cylZ') m.rotation.x=Math.PI/2;
  m.userData={orig:new THREE.Vector3(x,y,z)};
  return m;
}
function clear(){parts.forEach(p=>group.remove(p.mesh));parts=[]}
function add(name,w,h,d,color,x,y,z,mat,shape='box',op=1){let mesh=mk(w,h,d,color,x,y,z,shape,op);group.add(mesh);let p={name,w,h,d,mat,mesh,orig:new THREE.Vector3(x,y,z)};parts.push(p);return p}
function render(){
  let bom=document.getElementById('bom');bom.innerHTML='';
  parts.forEach((p,i)=>{let tr=document.createElement('tr');tr.innerHTML='<td>'+(i+1)+'</td><td>'+p.name+'</td><td>'+p.w+'×'+p.h+'×'+p.d+'</td><td>'+p.mat+'</td>';tr.onclick=()=>select(p);bom.appendChild(tr);});
  document.getElementById('cnt').textContent='التركيب مكتمل • '+parts.length+' قطعة';
}
function select(p){if(selected)selected.mesh.material.emissive.setHex(0);selected=p;p.mesh.material.emissive.setHex(0x333300);document.getElementById('sel').textContent='المحدد: '+p.name+' | '+p.w+'×'+p.h+'×'+p.d+' mm | '+p.mat;}
function feedPiston(){
  health=100;
  document.getElementById('pistonHealth').textContent='🍔 صحة البستن: 100% - شبعان ومبسوط';
  document.getElementById('detected').textContent='🍔🍔 البستن أكل برياني + شرب بيبسي، هسه عنده حيل يشتغل 1000 ساعة!';
  document.getElementById('view').style.boxShadow='0 0 30px #f59e0b';
  setTimeout(()=>document.getElementById('view').style.boxShadow='none',800);
}

function loadEngine(){
  clear();
  // قاعدة رفيعة - ما تغطي شي
  add('قاعدة',280,10,150,0x64748b,0,-90,0,'فولاذ');
  // كتلة - جدارين شفافين فقط، حتى تشوف البستن من جوة
  add('جدار أمامي شفاف',250,100,6,0x38bdf8,0,0,60,'زجاج','box',0.12);
  add('جدار خلفي شفاف',250,100,6,0x38bdf8,0,0,-60,'زجاج','box',0.12);
  // سقف
  add('غطاء علوي',250,8,130,0x334155,0,55,0,'ألمنيوم');
  // كرنك - نايم على X، تحت البستنات
  for(let i=0;i<5;i++){let x=-110+i*55; add('محمل كرنك '+(i+1),18,36,36,0xe2e8f0,x,-40,0,'فولاذ','cylX');}
  for(let i=0;i<4;i++){let x=-82+i*55; add('ثقل موازنة '+(i+1),12,55,45,0x94a3b8,x,-40,0,'فولاذ'); add('مرفق '+(i+1),14,20,20,0xf59e0b,x,-18,0,'فولاذ','cylX');}
  add('حذاف',80,80,14,0x334155,-155,-40,0,'فولاذ','cylX');
  add('بكرة',38,38,14,0x111827,155,-40,0,'مطاط','cylX');
  // 4 بستنات - واقفة عمودي، فوق الكرنك، ألوان مختلفة مثل مال جيميني
  let cols=[0xfacc15,0x38bdf8,0xd6a35c,0x94a3b8];
  for(let i=0;i<4;i++){
    let x=-82+i*55;
    add('ذراع '+(i+1),10,38,10,0xe2e8f0,x,2,0,'فولاذ');
    add('بستن '+(i+1),40,45,40,cols[i],x,38,0,'ألمنيوم','cylY');
    add('حلقة '+(i+1),42,3,42,0x1e293b,x,24,0,'فولاذ','cylY');
    add('حلقة 2 '+(i+1),42,3,42,0x1e293b,x,30,0,'فولاذ','cylY');
    add('دبوس '+(i+1),8,8,42,0xf59e0b,x,32,0,'فولاذ','cylZ');
    add('صمام سحب '+(i+1),7,28,7,0x10b981,x-11,68,0,'فولاذ','cylY');
    add('صمام عادم '+(i+1),7,28,7,0xef4444,x+11,68,0,'فولاذ','cylY');
  }
  // رأس + كامات
  add('رأس المحرك',250,12,130,0x1e293b,0,86,0,'ألمنيوم');
  add('عمود كامات',230,12,12,0xe2e8f0,0,98,0,'فولاذ','cylX');
  for(let i=0;i<8;i++){let x=-95+i*27; add('كامة '+(i+1),14,22,9,0xf59e0b,x,98,0,'فولاذ');}
  for(let i=0;i<4;i++){add('بخاخ '+(i+1),9,18,9,0xef4444,-82+i*55,112,0,'بلاستيك');}
  add('مجمع سحب',235,11,11,0x94a3b8,0,108,40,'ألمنيوم','cylX');
  add('مجمع عادم',235,11,11,0x78716c,0,108,-40,'فولاذ','cylX');
  add('توربين',42,28,42,0xa78bfa,125,0,0,'تيتانيوم','cylY');
  render();
  document.getElementById('detected').textContent='✅ محرك شبعان - '+parts.length+' قطعة - البستن واقف، الكرنك نايم';
}
function loadShip(){
  clear();
  add('بدن',260,42,70,0x1e3a8a,0,0,0,'فولاذ بحري');
  add('مقدمة',55,35,45,0x1e3a8a,150,2,0,'فولاذ','cone');
  add('جسر',55,45,45,0xf8fafc,-75,-38,0,'ألمنيوم');
  add('مدخنة',26,55,26,0xef4444,-18,-48,0,'فولاذ','cylY');
  add('صاري',9,110,9,0x8b5a2b,35,-55,0,'خشب','cylY');
  add('حاوية',45,26,26,0xef4444,18,32,0,'فولاذ');
  add('حاوية 2',45,26,26,0x10b981,75,32,0,'فولاذ');
  add('مروحة',38,9,38,0xe2e8f0,-145,0,0,'برونز','cylX');
  render();
}
function loadSusp(){
  clear();
  add('ذراع',160,15,25,0xef4444,0,0,0,'فولاذ');
  add('نابض',22,65,22,0xe2e8f0,-45,-40,0,'زنبركي','cylY');
  add('بوش',24,24,24,0x0284c7,-75,0,0,'مطاط','cylZ');
  add('بوش 2',24,24,24,0x0284c7,75,0,0,'مطاط','cylZ');
  add('مفصل',28,28,28,0xf59e0b,0,32,0,'فولاذ','sphere');
  add('مساعد',16,85,16,0x94a3b8,45,-18,0,'ألمنيوم','cylY');
  render();
}
function loadGear(){
  clear();
  add('علبة',190,100,85,0x1f2937,0,0,0,'ألمنيوم');
  add('ترس كبير',88,88,20,0xe2e8f0,-32,0,0,'فولاذ','cylZ');
  add('ترس صغير',48,48,20,0xf59e0b,45,0,0,'فولاذ','cylZ');
  add('ترس وسط',58,58,20,0x38bdf8,0,-55,0,'فولاذ','cylZ');
  add('عمود',165,14,14,0x94a3b8,0,0,0,'فولاذ','cylX');
  render();
}
function buildFromPrompt(){
  let t=document.getElementById('prompt').value||'';
  if(t.includes('سفينة')) loadShip();
  else if(t.includes('تعليق')) loadSusp();
  else if(t.includes('تروس')) loadGear();
  else loadEngine();
  document.getElementById('detected').textContent='تم بناء: '+t;
}
function explode(){
  assembled=!assembled;
  parts.forEach((p,i)=>{let t=assembled?p.orig:p.orig.clone().multiplyScalar(1.7).add(new THREE.Vector3(0,i%2?55:-35,0));let s=p.mesh.position.clone(),c=0;let iv=setInterval(()=>{c++;p.mesh.position.lerpVectors(s,t,c/30);if(c>=30)clearInterval(iv)},18);});
}
function resetCam(){
  camera.position.set(320,260,520);
  camera.lookAt(0,0,0);
  group.rotation.set(0,0.6,0);
}
function init(){
  scene=new THREE.Scene();scene.background=new THREE.Color(0x0f172a);
  camera=new THREE.PerspectiveCamera(50,document.getElementById('view').clientWidth/480,1,3000);
  camera.position.set(320,260,520);
  renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(document.getElementById('view').clientWidth,480);document.getElementById('view').appendChild(renderer.domElement);
  scene.add(new THREE.AmbientLight(0xffffff,.9));
  let l=new THREE.DirectionalLight(0xffffff,1);l.position.set(120,220,120);scene.add(l);
  scene.add(new THREE.GridHelper(600,24,0x334155,0x1e293b));
  group=new THREE.Group();group.rotation.set(0,0.6,0);scene.add(group);
  let drag=false,lx=0,ly=0;
  renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY});
  window.addEventListener('pointermove',e=>{if(!drag)return;group.rotation.y+=(e.clientX-lx)*0.01;group.rotation.x+=(e.clientY-ly)*0.01;lx=e.clientX;ly=e.clientY;});
  window.addEventListener('pointerup',()=>drag=false);
  renderer.domElement.addEventListener('click',e=>{let r=renderer.domElement.getBoundingClientRect();mouse.x=((e.clientX-r.left)/r.width)*2-1;mouse.y=-((e.clientY-r.top)/r.height)*2+1;raycaster.setFromCamera(mouse,camera);let h=raycaster.intersectObjects(parts.map(p=>p.mesh));if(h.length){let p=parts.find(x=>x.mesh===h[0].object);if(p)select(p);}});
  renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();camera.position.multiplyScalar(1+e.deltaY*0.001)},{passive:false});
  loadEngine();
  (function anim(){requestAnimationFrame(anim);
    if(playing){
      let rpm=+document.getElementById('rpm').value;
      angle=(angle+rpm/60)%720;
      // البستن يتحرك - إذا جوعان يتحرك شوية شوية، إذا شبعان يتحرك بقوة
      let power=health/100;
      parts.forEach(p=>{
        if(p.name.includes('بستن')){let n=parseInt(p.name.match(/\d+/)[0]);p.mesh.position.y=p.orig.y+Math.sin((angle+(n-1)*180)*Math.PI/180)*15*power;}
        if(p.name.includes('ذراع')){let n=parseInt(p.name.match(/\d+/)[0]);p.mesh.position.y=p.orig.y+Math.sin((angle+(n-1)*180)*Math.PI/180)*9*power;}
        if(p.name.includes('مرفق')){p.mesh.rotation.z=angle*Math.PI/180+Math.PI/2;}
      });
      // البستن يجوع مع الوقت - مثل ما قلت صار يومين ما أكل
      health=Math.max(20,health-0.02);
      document.getElementById('pistonHealth').textContent='🍔 صحة البستن: '+Math.round(health)+'% '+(health<50?' - جوعان! دوس أكّل البستن':' - شبعان');
      let pr=1+Math.max(0,Math.sin(angle*Math.PI/180))*2.5*power;
      document.getElementById('ang').textContent=Math.round(angle)+'° من 720°';document.getElementById('prs').textContent=pr.toFixed(1)+' bar';
      hist.push(pr);if(hist.length>60)hist.shift();gctx.clearRect(0,0,340,70);gctx.strokeStyle='#ef4444';gctx.lineWidth=2;gctx.beginPath();hist.forEach((v,i)=>{let x=i*5.6,y=62-v*16;i?gctx.lineTo(x,y):gctx.moveTo(x,y)});gctx.stroke();
    }
    renderer.render(scene,camera);})();
}
init();
</script>
</body>
</html>
