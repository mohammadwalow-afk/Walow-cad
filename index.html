<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0e17">
<link rel="manifest" href="manifest.json">
<title>WALOW CAD STUDIO PRO - V2</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{margin:0;background:#0a0e17;color:#fff}
header{padding:14px 16px;background:#111827;border-bottom:1px solid #222;display:flex;justify-content:space-between}
.card{background:#111827;border:1px solid #222;border-radius:14px;padding:12px;margin:10px}
input{flex:1;background:#030712;border:1px solid #374151;color:#fff;padding:11px;border-radius:9px}
button{background:#1f2937;color:#fff;border:1px solid #374151;padding:9px 12px;border-radius:9px;font-weight:700;cursor:pointer}
.btn-pro{background:#2563eb;border:none}
.btn-ok{background:#059669;border:none}
#view{width:100%;height:440px;border-radius:12px;overflow:hidden;background:#0f172a;position:relative}
#view canvas{display:block}
#hud{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.85);padding:10px;border-radius:10px;font-size:12px;pointer-events:none}
.row{display:flex;gap:8px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:8px;border-bottom:1px solid #222;text-align:right}
th{color:#38bdf8}
</style>
</head>
<body>
<header><div><b>WALOW CAD <span style="color:#38bdf8">PRO V2</span></b><div style="font-size:11px;color:#999">3D حقيقي - Three.js - بدون تراكب كتابة</div></div><span style="color:#10b981">● THREE.JS</span></header>

<div class="card">
<b>✨ صمّم بالوصف:</b>
<div class="row" style="margin-top:8px">
<input id="prompt" placeholder="محرك ، سفينة ، تعليق ، تروس ، روبوت...">
<button class="btn-pro" onclick="buildFromPrompt()">⚡ بناء</button>
</div>
<div id="detected" style="font-size:12px;color:#fbbf24;margin-top:6px"></div>
</div>

<div class="card">
<div class="row">
<button onclick="loadModel('engine')">محرك</button>
<button onclick="loadModel('suspension')">تعليق</button>
<button onclick="loadModel('gearbox')">تروس</button>
<button onclick="loadModel('ship')">سفينة</button>
<button onclick="loadModel('robot')">روبوت</button>
<button onclick="loadModel('factory')">مصنع</button>
<button onclick="loadModel('turbine')">توربين</button>
<button onclick="loadModel('drone')">درون</button>
</div>
</div>

<div class="card">
<div id="view"><div id="hud"><b style="color:#38bdf8">📐 الأبعاد mm</b><div id="dims">--</div><div id="sel">اضغط أي قطعة</div></div></div>
<div class="row" style="margin-top:10px">
<button class="btn-pro" onclick="explodeToggle()">💥 تفكيك / تجميع</button>
<button onclick="autoRotateToggle()">🔄 دوران تلقائي</button>
<button onclick="resetCam()">🎯 توسط</button>
</div>
<div style="margin-top:10px"><label>سرعة: <span id="rpmV">90 RPM</span></label><input type="range" id="rpm" min="0" max="600" value="90" oninput="document.getElementById('rpmV').textContent=this.value+' RPM'" style="width:100%"></div>
</div>

<div class="card"><b>🔩 BOM</b><table><thead><tr><th>#</th><th>القطعة</th><th>الأبعاد mm</th><th>الخامة</th></tr></thead><tbody id="bom"></tbody></table></div>

<script>
let scene,camera,renderer,group,parts=[],selected=null,autoRot=true,exploded=false;
let raycaster=new THREE.Raycaster(), mouse=new THREE.Vector2();
function box(w,h,d,color,x,y,z,shape='box'){
  let geo;
  if(shape=='cyl') geo=new THREE.CylinderGeometry(w/2,h,d,24);
  else if(shape=='sphere') geo=new THREE.SphereGeometry(w/2,20,20);
  else geo=new THREE.BoxGeometry(w,h,d);
  let m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:color,roughness:.35,metalness:.6}));
  m.position.set(x,y,z); m.userData={orig:new THREE.Vector3(x,y,z),w,h,d};
  return m;
}
function clear(){ parts.forEach(p=>group.remove(p.mesh)); parts=[]; }
function add(name,w,h,d,color,x,y,z,mat,shape='box'){ let mesh=box(w,h,d,color,x,y,z,shape); group.add(mesh); parts.push({name,w,h,d,color,mat,mesh,orig:new THREE.Vector3(x,y,z)}); }
function loadModel(t){
  clear();
  if(t=='engine'){
    add('كتلة المحرك',180,110,120,0x334155,0,0,0,'فولاذ');
    add('بستن 1',38,42,38,0x38bdf8,-40,-20,0,'ألمنيوم','cyl');
    add('بستن 2',38,42,38,0x38bdf8,40,-20,0,'ألمنيوم','cyl');
    add('عمود الكرنك',160,22,22,0xe2e8f0,0,50,0,'فولاذ','cyl');
    add('شمعة',12,28,12,0xf59e0b,-40,-75,0,'سيراميك','cyl');
    add('توربين',44,44,30,0xa78bfa,110,0,0,'تيتانيوم','cyl');
  } else if(t=='suspension'){
    add('ذراع تعليق',170,18,28,0xef4444,0,0,0,'فولاذ');
    add('نابض',22,70,22,0xe2e8f0,-50,-45,0,'زنبركي','cyl');
    add('بوش أزرق',24,24,24,0x0284c7,-80,0,0,'مطاط','cyl');
    add('بوش أزرق 2',24,24,24,0x0284c7,80,0,0,'مطاط','cyl');
    add('مفصل كروي',28,28,28,0xf59e0b,0,35,0,'فولاذ','sphere');
    add('مساعد',18,90,18,0x94a3b8,50,-20,0,'ألمنيوم','cyl');
  } else if(t=='ship'){
    add('بدن',280,60,80,0x1e3a8a,0,20,0,'فولاذ بحري');
    add('جسر',60,50,50,0xf8fafc,-80,-30,0,'ألمنيوم');
    add('حاوية',50,30,30,0xef4444,20,0,0,'فولاذ');
    add('حاوية 2',50,30,30,0x10b981,80,0,0,'فولاذ');
    add('مروحة',36,36,12,0xe2e8f0,150,35,0,'برونز','cyl');
  } else if(t=='gearbox'){
    add('ترس كبير',90,90,22,0xe2e8f0,-35,0,0,'فولاذ','cyl');
    add('ترس صغير',50,50,22,0xf59e0b,45,0,0,'فولاذ','cyl');
    add('ترس وسط',60,60,22,0x38bdf8,0,-55,0,'فولاذ','cyl');
    add('عمود',170,16,16,0x94a3b8,0,0,0,'فولاذ','cyl');
  } else if(t=='robot'){
    add('قاعدة',80,30,80,0x334155,0,70,0,'فولاذ');
    add('مفصل',30,50,30,0xf59e0b,0,30,0,'فولاذ','sphere');
    add('ذراع',22,80,22,0xe2e8f0,0,-20,0,'ألمنيوم');
    add('قبضة',26,22,22,0xef4444,40,-70,0,'كربون');
  } else if(t=='turbine'){
    add('غلاف',90,90,110,0x94a3b8,0,0,0,'فولاذ','cyl');
    add('شفرة 1',14,70,8,0x38bdf8,0,-50,0,'تيتانيوم');
    add('شفرة 2',70,14,8,0x38bdf8,-45,0,0,'تيتانيوم');
    add('عمود',20,20,150,0xe2e8f0,0,0,0,'فولاذ','cyl');
  } else if(t=='drone'){
    add('هيكل',70,18,70,0x111827,0,0,0,'كربون');
    add('ذراع 1',60,10,10,0x334155,-55,0,-20,'كربون');
    add('ذراع 2',60,10,10,0x334155,55,0,-20,'كربون');
    add('مروحة 1',30,6,30,0xe2e8f0,-85,-10,-40,'بلاستيك','cyl');
    add('بطارية',50,14,30,0x10b981,0,-15,0,'ليثيوم');
  } else {
    add('سير',260,14,50,0x334155,0,30,0,'مطاط');
    add('بكرة',30,30,30,0x94a3b8,-100,45,0,'فولاذ','cyl');
    add('بكرة 2',30,30,30,0x94a3b8,100,45,0,'فولاذ','cyl');
    add('مكبس',40,50,40,0xef4444,60,-40,0,'فولاذ');
  }
  renderBOM();
}
function renderBOM(){
  let bom=document.getElementById('bom'); bom.innerHTML='';
  parts.forEach((p,i)=>{
    let tr=document.createElement('tr');
    tr.innerHTML='<td>'+(i+1)+'</td><td>'+p.name+'</td><td>'+p.w+' × '+p.h+' × '+p.d+'</td><td>'+p.mat+'</td>';
    tr.onclick=()=>select(p);
    bom.appendChild(tr);
  });
  document.getElementById('dims').textContent='280 × 140 × 120';
}
function select(p){
  if(selected) selected.mesh.material.emissive.setHex(0x000000);
  selected=p; p.mesh.material.emissive.setHex(0x333300);
  document.getElementById('sel').textContent='المحدد: '+p.name+' | '+p.w+'×'+p.h+'×'+p.d+' mm | '+p.mat;
}
function buildFromPrompt(){
  let t=document.getElementById('prompt').value||'';
  if(t.includes('تعليق')) loadModel('suspension');
  else if(t.includes('سفينة')) loadModel('ship');
  else if(t.includes('تروس')) loadModel('gearbox');
  else if(t.includes('روبوت')) loadModel('robot');
  else if(t.includes('توربين')) loadModel('turbine');
  else if(t.includes('درون')) loadModel('drone');
  else if(t.includes('مصنع')) loadModel('factory');
  else loadModel('engine');
  document.getElementById('detected').textContent='تم بناء: '+t;
}
function explodeToggle(){
  exploded=!exploded;
  parts.forEach((p,i)=>{ p.mesh.position.copy(p.orig).multiplyScalar(exploded?1.6:1); });
}
function autoRotateToggle(){ autoRot=!autoRot; }
function resetCam(){ camera.position.set(220,180,320); camera.lookAt(0,0,0); }
function init(){
  scene=new THREE.Scene(); scene.background=new THREE.Color(0x0f172a);
  camera=new THREE.PerspectiveCamera(50, document.getElementById('view').clientWidth/440, 1, 2000);
  camera.position.set(220,180,320);
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(document.getElementById('view').clientWidth,440);
  document.getElementById('view').appendChild(renderer.domElement);
  scene.add(new THREE.AmbientLight(0xffffff,.8));
  let light=new THREE.DirectionalLight(0xffffff,1); light.position.set(100,200,100); scene.add(light);
  let grid=new THREE.GridHelper(500,20,0x334155,0x1e293b); scene.add(grid);
  group=new THREE.Group(); scene.add(group);
  // سحب للتدوير
  let drag=false,lx=0,ly=0;
  renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY});
  window.addEventListener('pointermove',e=>{if(!drag)return; group.rotation.y+=(e.clientX-lx)*0.01; group.rotation.x+=(e.clientY-ly)*0.01; lx=e.clientX; ly=e.clientY;});
  window.addEventListener('pointerup',()=>drag=false);
  renderer.domElement.addEventListener('click',e=>{
    let r=renderer.domElement.getBoundingClientRect();
    mouse.x=((e.clientX-r.left)/r.width)*2-1; mouse.y=-((e.clientY-r.top)/r.height)*2+1;
    raycaster.setFromCamera(mouse,camera);
    let hits=raycaster.intersectObjects(parts.map(p=>p.mesh));
    if(hits.length){ let p=parts.find(x=>x.mesh===hits[0].object); if(p) select(p); }
  });
  renderer.domElement.addEventListener('wheel',e=>{e.preventDefault(); camera.position.multiplyScalar(1+e.deltaY*0.001);},{passive:false});
  loadModel('suspension');
  (function anim(){ requestAnimationFrame(anim); if(autoRot) group.rotation.y+=0.005; renderer.render(scene,camera); })();
}
init();
</script>
</body>
</html>
